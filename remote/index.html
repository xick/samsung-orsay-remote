<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>TV Remote</title>
<style>
  :root {
    --bg: #f2f3f5; --panel: #ffffff; --key: #e8eaee; --key-hi: #d9dce2;
    --text: #1b1d22; --muted: #6a7080; --accent: #2f6bff; --danger: #d93a3a;
    --ok: #1f9d55; --shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1d2026; --key: #2a2e36; --key-hi: #373c46;
      --text: #eceef2; --muted: #98a0b0; --accent: #5b8cff; --danger: #ff6b6b;
      --ok: #4cc38a; --shadow: 0 1px 2px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100dvh; display: flex; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #tvlabel { color: var(--muted); font-size: 13px; }
  .iconbtn { background: none; border: 0; color: var(--muted); padding: 8px; border-radius: 8px; cursor: pointer; }
  .iconbtn:focus-visible, button:focus-visible, input:focus-visible
    { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panel { background: var(--panel); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 10px; }
  .row3 { grid-template-columns: repeat(3, 1fr); }
  .row4 { grid-template-columns: repeat(4, 1fr); }

  button.key { background: var(--key); color: var(--text); border: 0; border-radius: 14px;
    min-height: 52px; font: inherit; font-weight: 600; cursor: pointer; user-select: none;
    touch-action: manipulation; transition: transform .06s, background .12s; }
  button.key:active { background: var(--key-hi); transform: scale(.96); }
  button.key.small { min-height: 44px; font-size: 14px; }
  .numpad button.key { min-height: 42px; }
  .numpad button.key.small { min-height: 38px; }
  .mediapad button.key { min-height: 36px; }
  .powerrow button.key, .powerrow button.key.small { min-height: 42px; }
  .mediapad .doubles { letter-spacing: -2px; }
  .mediapad .icon-lg { font-size: 20px; }
  button.key.mute.on { background: var(--danger); color: #fff; }
  button.key[disabled] { opacity: .35; cursor: not-allowed; }

  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 34px);
    gap: 6px; padding: 6px; background: var(--key); border-radius: 22px; }
  .dpad button { background: var(--panel); border: 0; border-radius: 14px; color: var(--text);
    font-size: 17px; }
  .dpad .ok { background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; border-radius: 18px; }
  .dpad .up { grid-area: 1/2; } .dpad .left { grid-area: 2/1; } .dpad .ok { grid-area: 2/2; }
  .dpad .right { grid-area: 2/3; } .dpad .down { grid-area: 3/2; }

  .rocker { display: grid; grid-template-rows: 1fr auto 1fr; gap: 6px; }
  .rocker .label { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .06em; }

  .volrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
  .volrow .big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .volrow .unit { font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; height: 34px; margin: 0; accent-color: var(--accent); }
  .vrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .vrow button.key { min-height: 42px; }

  .note { font-size: 13px; color: var(--muted); margin: 0; }
  .note b { color: var(--text); font-weight: 600; }

  #toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0;
    pointer-events: none; transition: .2s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: var(--danger); }

  .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TV Remote</h1>
    <div id="tvlabel">TV</div>
  </header>

  <section class="panel" aria-label="Volume">
    <div class="volrow">
      <span><span class="big" id="volnum">–</span> <span class="unit">/100</span></span>
      <input type="range" id="vol" min="0" max="100" value="0" aria-label="Volume level">
      <button class="key small mute" id="mute" aria-pressed="false">Unmuted</button>
    </div>
    <div class="vrow" style="margin-top:8px">
      <button class="key" id="volup" aria-label="Volume up">Volume ＋</button>
      <button class="key" id="voldown" aria-label="Volume down">Volume －</button>
    </div>
    <p class="note" id="volnote" style="margin-top:10px" hidden></p>
  </section>

  <section class="panel grid row3 powerrow" aria-label="Power and input">
    <button class="key" data-key="KEY_POWER" aria-label="Power Off">Power Off</button>
    <button class="key small" data-key="KEY_SOURCE">Source</button>
    <button class="key small" data-key="KEY_MUTE">Mute key</button>
  </section>

  <section class="panel" aria-label="Navigation">
    <div class="dpad">
      <button class="up" data-key="KEY_UP" aria-label="Up">▲</button>
      <button class="left" data-key="KEY_LEFT" aria-label="Left">◀</button>
      <button class="ok" data-key="KEY_ENTER" aria-label="OK">OK</button>
      <button class="right" data-key="KEY_RIGHT" aria-label="Right">▶</button>
      <button class="down" data-key="KEY_DOWN" aria-label="Down">▼</button>
    </div>
    <div class="grid row3" style="margin-top:10px">
      <button class="key small" data-key="KEY_RETURN">Back</button>
      <button class="key small" data-key="KEY_CONTENTS">Smart Hub</button>
      <button class="key small" data-key="KEY_EXIT">Exit</button>
      <button class="key small" data-key="KEY_MENU">Menu</button>
      <button class="key small" data-key="KEY_INFO">Info</button>
      <button class="key small" data-key="KEY_TOOLS">Tools</button>
    </div>
  </section>

  <section class="panel grid row3 numpad" aria-label="Number pad">
    <button class="key" data-key="KEY_1">1</button><button class="key" data-key="KEY_2">2</button><button class="key" data-key="KEY_3">3</button>
    <button class="key" data-key="KEY_4">4</button><button class="key" data-key="KEY_5">5</button><button class="key" data-key="KEY_6">6</button>
    <button class="key" data-key="KEY_7">7</button><button class="key" data-key="KEY_8">8</button><button class="key" data-key="KEY_9">9</button>
    <button class="key small" data-key="KEY_GUIDE">Guide</button><button class="key" data-key="KEY_0">0</button><button class="key small" data-key="KEY_PRECH">Prev ch</button>
    <button class="key small" data-key="KEY_CHDOWN">CH −</button><button class="key small" data-key="KEY_CHUP">CH ＋</button><button class="key small" data-key="KEY_CH_LIST">CH list</button>
  </section>

  <section class="panel grid row3 mediapad" aria-label="Media keys">
    <button class="key small doubles" data-key="KEY_REWIND">◀◀</button>
    <button class="key small" data-key="KEY_PLAY">▶</button>
    <button class="key small icon-lg" data-key="KEY_PAUSE">⏸</button>
    <button class="key small doubles" data-key="KEY_FF">▶▶</button>
    <button class="key small icon-lg" data-key="KEY_STOP">⏹</button>
    <button class="key small icon-lg" data-key="KEY_REC">⏺</button>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>


<script>
const $ = (id) => document.getElementById(id);
const toastEl = $('toast');
let toastTimer;
function toast(msg, isErr = false) {
  toastEl.textContent = msg;
  toastEl.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (toastEl.className = ''), isErr ? 4000 : 1200);
}

async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error('Cannot reach the remote server');
  }
  if (!res.ok) {
    let message = res.statusText || ('Error ' + res.status);
    try {
      const data = await res.json();
      if (data && data.error) message = data.error;
    } catch {}
    throw new Error(message);
  }
  return res.json();
}

let status = { host: '' };

function renderStatus() {
  $('tvlabel').textContent = status.host || location.hostname;
}

// --- volume & mute -------------------------------------------------------
let muted = false;
let dragging = false;

function paint(state) {
  if (typeof state.volume === 'number') {
    $('vol').value = String(state.volume);
    $('volnum').textContent = String(state.volume);
  }
  if (typeof state.mute === 'boolean') {
    muted = state.mute;
    $('mute').textContent = muted ? 'Muted' : 'Unmuted';
    $('mute').classList.toggle('on', muted);
    $('mute').setAttribute('aria-pressed', String(muted));
  }
}

function volError(e) {
  toast(e.message, true);
}

async function volume(action, value) {
  try {
    paint(await api('api/volume.php', value === undefined ? { action } : { action, volume: value }));
  } catch (e) { volError(e); }
}

async function refreshVolume() {
  try {
    paint(await api('api/volume.php'));
    $('volnote').hidden = true;
  } catch (e) {
    $('volnote').textContent = 'TV not responding — is it on?';
    $('volnote').hidden = false;
  }
}

$('volup').addEventListener('click', () => volume('up'));
$('voldown').addEventListener('click', () => volume('down'));
$('mute').addEventListener('click', () => volume('toggle_mute'));

$('vol').addEventListener('input', () => {
  dragging = true;
  $('volnum').textContent = $('vol').value;
});
$('vol').addEventListener('change', () => {
  dragging = false;
  volume('set', Number($('vol').value));
});

// --- keys ---------------------------------------------------------------
async function sendKey(name) {
  try {
    await api('api/key.php', { key: name });
  } catch (e) { toast(e.message, true); }
}

document.addEventListener('click', (ev) => {
  const button = ev.target.closest('[data-key]');
  if (button) sendKey(button.dataset.key);
});

// --- boot ----------------------------------------------------------------
async function refresh() {
  try { status = await api('api/status.php'); } catch (e) { toast(e.message, true); }
  renderStatus();
}

refresh().then(() => {
  refreshVolume();
  setInterval(() => { if (!dragging && document.visibilityState === 'visible') refreshVolume(); }, 3000);
});
</script>
</body>
</html>
